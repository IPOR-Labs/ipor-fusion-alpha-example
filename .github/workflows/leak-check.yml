name: Leak check

# Commit messages, the branch name (merge commits carry it), the PR text and
# added lines are all public once merged. LEAK_PATTERNS holds the internal
# names; fork PRs do not get it and run the built-in pattern only.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # from tag: v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No internal references
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${HEAD}^{commit}"
          # The base branch's script, so a PR cannot weaken its own check
          # (the head's only while the base has none).
          SCRIPT="$(mktemp)"
          git show "${BASE}:scripts/leak-check.sh" > "${SCRIPT}" 2>/dev/null \
            || git show "${HEAD}:scripts/leak-check.sh" > "${SCRIPT}"
          {
            git log --format=%B "${BASE}..${HEAD}"
            printf '%s\n%s\n%s\n' "${BRANCH}" "${TITLE}" "${BODY}"
            git diff "${BASE}...${HEAD}" | sed -n '/^+++ /d; s/^+//p'
          } | bash "${SCRIPT}" || {
            echo "::error::Internal references found: reword the commits (rebase) and edit the PR text."
            exit 1
          }
