name: Python build

on:
  workflow_call:

    secrets:
      ARBITRUM_PROVIDER_URL:
        required: true
      BASE_PROVIDER_URL:
        required: true
      ETHEREUM_PROVIDER_URL:
        required: true

    inputs:
      python-version:
        description: "Python version"
        type: string
        default: "3.11"
        required: false
      uv-version:
        description: "uv version"
        type: string
        default: 0.11.21
        required: false
      test-options:
        description: "Extra pytest options"
        type: string
        default: "-v -s"
        required: false
      format-code-enabled:
        description: "Enable code formatting"
        type: boolean
        default: true
        required: false
      static-code-analysis-enabled:
        description: "Enable static code analysis"
        type: boolean
        default: true
        required: false
      build-enabled:
        description: "Enable package build"
        type: boolean
        default: true
        required: false
      test-enabled:
        description: "Enable pytest tests"
        type: boolean
        default: true
        required: false

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # from tag: v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Set up uv
        # from tag: v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked
        id: install

      - name: Format check
        if: inputs.format-code-enabled
        run: uv run ruff format --check .

      - name: Lint
        if: inputs.static-code-analysis-enabled
        run: uv run ruff check .

      - name: Tests
        if: inputs.test-enabled
        run: |
          uv run pytest ${{ inputs.test-options }}
        env:
          PROVIDER_URL: ${{ secrets.BASE_PROVIDER_URL }}
        id: tests
